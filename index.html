gap:7px;flex-wrap:wrap;align-items:center;margin-left:auto}.connect input{width:210px;font-size:13px;padding:8px}.btn{border:1px solid #456b99;background:#213c62;color:#edf5ff;border-radius:7px;padding:8px 10px}.btn:hover{background:#315788}.fileBtn{display:inline-flex;align-items:center}.foot{color:#b4c3d8;font-size:12px;padding:7px 12px;border-top:1px solid #34445b}.icaoIcon{background:#111e32;border:1px solid #d9e6ff;border-radius:6px;padding:3px 6px;color:#fff;font-weight:800;white-space:nowrap;font-size:12px;box-shadow:0 2px 9px #0009}.sosPin{display:flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;border:2px solid #fff;background:#25ada8;color:#071b25;font-size:10px;font-weight:900;box-shadow:0 2px 8px #000b}.countryPin{display:inline-flex;align-items:center;justify-content:center;min-width:23px;height:23px;padding:0 4px;border-radius:5px;border:1.5px solid #e3eefd;background:#33749b;color:white;font-weight:800;font-size:10px;box-shadow:0 2px 7px #0009}.regionPin{display:inline-flex;align-items:center;justify-content:center;min-width:23px;height:23px;padding:0 4px;border-radius:5px;border:1.5px solid #f1dbff;background:#81539c;color:white;font-weight:800;font-size:10px;box-shadow:0 2px 7px #0009}.icaoIcon b{color:#ffca70;font-size:11px;margin-left:4px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#172338;color:#ebf2ff}.popup{max-height:320px;overflow:auto;max-width:350px}.popup button{display:block;width:100%;border:0;border-bottom:1px solid #344660;background:none;text-align:left;color:#f0f5ff;padding:9px 2px}.popup button:hover{background:#2b3f5a}.notice{padding:12px;color:#bccbe0}.modal{position:fixed;inset:0;background:#000b;z-index:1200;display:none;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.modalbody{background:#172439;border:1px solid #4c607b;border-radius:12px;max-width:650px;width:100%;max-height:80vh;overflow:auto;padding:18px;overflow-wrap:anywhere}.close{flo /* Geographic markers are native Leaflet markers; panes fix their stacking order. */
.alert-marker-leaflet{background:transparent;border:0;overflow:visible!important}.alert-marker-inner{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;cursor:pointer;pointer-events:auto;line-height:1}
.alert-marker-inner{display:block}
.alert-marker-leaflet:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:5px}
.alert-marker-inner .icaoIcon,.alert-marker-inner .sosPin,.alert-marker-inner .countryPin,.alert-marker-inner .regionPin{display:inline-flex;align-items:center;justify-content:center}
.group-reset{margin-left:auto;flex-shrink:0;background:#294566;border:1px solid #6082a6;color:#fff;border-radius:5px;padding:4px 9px;font-size:12px}.count:has(.group-reset){display:flex;align-items:center;gap:8px;justify-content:space-between}.feed-group-heading{position:sticky;top:0;z-index:2;padding:10px 12px;background:#243b54;color:#ffd18f;border-bottom:1px solid #6d84a0;font-weight:750;font-size:12px}.popup-group{font-size:12px;font-weight:750;color:#ffc27d;background:#24364d;padding:7px 6px;margin-top:10px;border-radius:5px}.popup-empty{padding:9px 3px;color:#99afc7;font-size:12px}
/* Scope label appears first in each alert's tag row. */
.scopeTag{font-weight:800;white-space:nowrap;color:#f5f8ff}
.scope-icao{background:#263f67;border-color:#a8c9fa}
.scope-local{background:#13585c;border-color:#54d0ca;color:#bafbf4}
.scope-region{background:#53336e;border-color:#c6a0e6}
.scope-country{background:#1d3f89;border-color:#79aaff;color:#e0ebff}
/* Mobile compact controls: prioritize the Alert feed over search/filter chrome. */
@media (max-width:760px){
  .top{padding:5px 8px;gap:4px;}
  .top h1{font-size:14px;margin:0;width:auto;}
  .top small,.top .status{font-size:10px;}
  .connect{gap:4px;}
  .connect input{padding:5px 6px;font-size:12px;min-width:0;}
  .connect .btn{padding:5px 7px;font-size:11px;}
  body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  .top{flex:0 0 auto;}
  .shell{height:auto;min-height:0;flex:1 1 auto;display:flex;flex-direction:column;}
  .side{height:auto;min-height:0;flex:1 1 auto;overflow:hidden;}
  .mapwrap{order:-1;flex:0 0 25%;height:25%;min-height:130px;}
  .controls{padding:5px 7px;gap:4px;flex:0 0 auto;}
  .controls input,.controls select{padding:5px 8px;height:35px;min-height:35px;font-size:16px;line-height:20px;}

  .feed{flex:1 1 auto;min-height:0;overscroll-behavior:contain;}
  .alert{padding:8px 9px;}
  .alert .heading{margin:4px 0;line-height:1.35;}
  .alert .meta{gap:3px;}
}

/* Country autocomplete, supports keyboard and mobile touch. */
.country-suggestions{position:absolute;z-index:1300;top:calc(100% + 3px);left:0;right:0;max-height:225px;overflow:auto;background:#1d2d43;border:1px solid #6d829f;border-radius:8px;box-shadow:0 12px 26px #0008;overscroll-behavior:contain}
.country-suggestions[hidden]{display:none!important}
.country-option{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid #344861;background:transparent;color:#eff5ff;padding:10px 12px;text-align:left;font-size:13px;cursor:pointer;min-height:39px}
.country-option:last-child{border-bottom:0}.country-option:hover,.country-option.is-active{background:#365b7c}.country-option small{font-size:11px;color:#b9ccdf;white-space:nowrap}
/* 상세 팝업에서 심각도는 테두리/배경 없이 글자색만 표시 */
.modalbody .detail-severity{display:inline;border:0!important;background:transparent!important;padding:0!important;border-radius:0!important;box-shadow:none!important;font-weight:800}

/* Reliable marker display above the offline vector canvas */
#alert-overlay{position:absolute;inset:0;z-index:650;pointer-events:none;overflow:hidden}
.alert-map-point{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:transparent;border:0;padding:0;margin:0;cursor:pointer;white-space:nowrap;line-height:1}
.alert-map-point[hidden]{display:none!important}
.article-marker-selected{filter:drop-shadow(0 0 5px #ffea7a) drop-shadow(0 0 10px #ffe28b);animation:medaireMarkerPulse 1.5s ease-in-out infinite;}
.article-marker-selected>span{outline:3px solid #fff08b;outline-offset:3px;border-radius:9px;box-shadow:0 0 0 5px rgba(255,201,52,.4)!important;}
@keyframes medaireMarkerPulse{0%,100%{filter:drop-shadow(0 0 4px #ffe481)}50%{filter:drop-shadow(0 0 13px #ffd54f) drop-shadow(0 0 6px #fff)}}
@media(prefers-reduced-motion:reduce){.article-marker-selected{animation:none}}
.alert-map-point:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:5px}
.alert-map-point .icaoIcon,.alert-map-point .sosPin,.alert-map-point .countryPin,.alert-map-point .regionPin{display:inline-flex;align-items:center;justify-content:center}

/* Collapsible country-first alert feed */
.country-alert-group{border-bottom:1px solid #35465c}
.country-alert-group>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 15px;background:#192a41;cursor:pointer;font-weight:750;color:#eaf2ff;user-select:none}
.country-alert-group>summary::-webkit-details-marker{display:none}
.country-alert-group>summary:hover{background:#263d57}
.country-alert-group>summary:before{content:'▸';color:#93c8ec;font-size:14px;transition:transform .15s}
.country-alert-group[open]>summary:before{transform:rotate(90deg)}
.country-alert-group .country-group-count{margin-left:auto;color:#b4c9df;background:#2b435f;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:650}
.country-alert-group .country-latest{font-size:11px;color:#91abc8;font-weight:400}
.country-alert-group>.alert{padding-left:22px}
@media(max-width:760px){.country-alert-group>summary{padding:10px 11px}.country-alert-group>.alert{padding-left:14px}}

/* Compact top-right controls and independent flight route toggles */
.connect{gap:6px;flex-wrap:nowrap}.connect .route-switch{min-width:66px;white-space:nowrap}
.route-switch[aria-pressed="true"]{border-color:#f5d58b;background:#51421c;color:#ffe8a1}
#routeHL8372[aria-pressed="true"]{border-color:#b6ea7a;background:#304423;color:#d7ffa4}
.foot{line-height:1.5}
.flight-route-label{background:#192638f0;color:#fff;border:1px solid #a0b4c9;padding:2px 5px;border-radius:4px;white-space:nowrap;font-size:11px;font-weight:750;box-shadow:0 1px 5px #0009}
.flight-route-waypoint{width:12px;height:12px;border:1.5px solid #142538;border-radius:50%;box-shadow:0 0 0 1px #fff7}

#flight-waypoint-overlay{position:absolute;inset:0;z-index:640;pointer-events:none;overflow:hidden}
.flight-wp-item{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:5px;white-space:nowrap;border:0;background:transparent;padding:0;cursor:pointer}
.flight-wp-dot{width:13px;height:13px;border-radius:50%;border:2px solid #f4f7fc;box-shadow:0 0 0 1px #142538,0 1px 6px #000b;flex:0 0 13px}
.flight-wp-name{padding:2px 5px;border:1px solid;border-radius:4px;background:#182535ec;font-size:11px;line-height:1.35;font-weight:750;color:#fff;box-shadow:0 1px 5px #0009}
/* Waypoint labels: route-perpendicular orientation and cross-aircraft collision avoidance */
.flight-wp-item{display:block!important;overflow:visible!important;width:13px;height:13px}
.flight-wp-dot{display:block}
.flight-wp-name{position:absolute;left:16px;top:6px;transform-origin:left center;pointer-events:none;display:inline-block;white-space:nowrap;will-change:transform}
.flight-wp-item:hover .flight-wp-dot,.flight-wp-item:focus-visible .flight-wp-dot{outline:3px solid #fff9a6;outline-offset:2px}

/* Label-only Flight Map styling. Preserve the original circular waypoint pins. */
#flight-waypoint-overlay .flight-wp-item{width:13px!important;height:13px!important;transform:translate(-50%,-50%)!important;overflow:visible!important;display:block!important;z-index:1}
#flight-waypoint-overlay .flight-wp-dot{display:block;width:13px;height:13px;border-radius:50%;border:2px solid #f4f7fc;box-shadow:0 0 0 1px #142538,0 1px 6px #000b}
#flight-waypoint-overlay .flight-wp-name{position:absolute;left:16px;top:6px;transform-origin:left center;white-space:nowrap;padding:2px 4px;border:1px solid;border-radius:4px;font-weight:750;font-size:10px;line-height:1.3;box-shadow:0 1px 3px #0005;pointer-events:none}
#flight-waypoint-overlay .flight-wp-item:hover .flight-wp-dot,#flight-waypoint-overlay .flight-wp-item:focus-visible .flight-wp-dot{outline:3px solid #fff9a6;outline-offset:2px}

<script>
'use strict';
const $=id=>document.getElementById(id);

// Offline vector world map. Three longitudinal copies maintain a continuous
// basemap across the international date line without network tile requests.
const map=L.map('map',{worldCopyJump:true,preferCanvas:true,zoomControl:true,zoomSnap:0.5,minZoom:1,maxZoom:13}).setView([15,20],2);

// Manual ICAO lookup. FAA app's NDB reference KML is a GitHub Pages static file;
// no MedAire API calls or additional GAS deployment are required.
const MANUAL_ICAO_KML='https://bomi87.github.io/FLIGHT_MAP/ACJ_NDB.kml';
let manualAirportsCache=null,manualSelectedAirport=null,manualIcaoFrame=0;
const manualOverlay=$('manual-icao-overlay');
const manualStatus=$('manualIcaoStatus');
function manualIcaoMessage(msg){manualStatus.textContent=msg;manualStatus.hidden=!msg;}
function manualIcaoPopup(){
 if(!manualSelectedAirport)return;
 const a=manualSelectedAirport;
 L.popup({maxWidth:270}).setLatLng([a.lat,a.lon]).setContent((()=>{const box=document.createElement('div');const title=document.createElement('strong');title.textContent=a.code;const name=document.createElement('div');name.textContent=a.name;box.append(title,name);return box;})()).openOn(map);
}
function drawManualIcaoMarker(){
 manualIcaoFrame=0;
 manualOverlay.replaceChildren();
 if(!manualSelectedAirport)return;
 const a=manualSelectedAirport,size=map.getSize();
 for(const shift of [-720,-360,0,360,720]){
  const xy=map.latLngToContainerPoint([a.lat,a.lon+shift]);
  if(xy.x < -90 || xy.x>size.x+90 || xy.y < -40 || xy.y>size.y+40)continue;
  const button=document.createElement('button');button.type='button';button.className='manual-airport-pin';
  button.style.left=xy.x+'px';button.style.top=xy.y+'px';button.title=a.name||a.code;
  const inner=document.createElement('span');inner.className='airport-pin-inner';inner.textContent=a.code;button.append(inner);
  button.addEventListener('click',event=>{event.stopPropagation();manualIcaoPopup();});
  manualOverlay.append(button);
 }
}
function scheduleManualIcaoMarker(){if(!manualIcaoFrame)manualIcaoFrame=requestAnimationFrame(drawManualIcaoMarker);}
map.on('move zoom resize viewreset moveend zoomend',scheduleManualIcaoMarker);
function parseManualIcaoKml(xmlText){
 const xml=new DOMParser().parseFromString(xmlText,'application/xml');
 if(xml.getElementsByTagName('parsererror').length)throw Error('KML 형식 오류');
 const items=[];
 for(const p of xml.getElementsByTagName('Placemark')){
  const point=p.getElementsByTagName('Point')[0];
  const coordinate=point?.getElementsByTagName('coordinates')[0]?.textContent?.trim()?.split(/\s+/)[0];
  if(!coordinate)continue;
  const [lon,lat]=coordinate.split(',').map(Number);
  if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)continue;
  const name=p.getElementsByTagName('name')[0]?.textContent?.trim()||'';
  const codes=(name.toUpperCase().match(/\b[A-Z]{4}\b/g)||[]);
  for(const code of codes)items.push({code,lat,lon,name});
 }
 return items;
}
// Independent worldwide airport coordinates, no Nominatim calls or GAS geocoder quota.
// OurAirports publishes a daily public-domain CSV; a shared CDN handles simultaneous users.
const ICAO_AIRPORT_CSV_URLS=[
 'https://davidmegginson.github.io/ourairports-data/airports.csv',
 'https://cdn.jsdelivr.net/gh/davidmegginson/ourairports-data@main/airports.csv'
];
let allIcaoAirportsPromise=null;
function splitAirportCsvRow(line){
 const cells=[];let value='',quoted=false;
 for(let i=0;i<line.length;i++){
  const ch=line[i];
  if(ch==='"'){
   if(quoted&&line[i+1]==='"'){value+='"';i++;}
   else quoted=!quoted;
  }else if(ch===','&&!quoted){cells.push(value);value='';}
  else value+=ch;
 }
 cells.push(value);return cells;
}
async function getWorldwideIcaoAirports(){
 if(allIcaoAirportsPromise)return allIcaoAirportsPromise;
 allIcaoAirportsPromise=(async()=>{
  let csv='',lastError=null;
  for(const url of ICAO_AIRPORT_CSV_URLS){
   try{
    const res=await fetch(url,{mode:'cors',cache:'force-cache'});
    if(!res.ok)throw Error('HTTP '+res.status);
    csv=await res.text();
    if(!csv.includes('latitude_deg')||!csv.includes('longitude_deg'))throw Error('공항 좌표 CSV 형식 오류');
    break;
   }catch(err){lastError=err;}
  }
  if(!csv)throw Error('전 세계 공항 좌표 자료를 불러올 수 없습니다: '+(lastError?.message||''));
  const lines=csv.split(/\r?\n/),headers=splitAirportCsvRow(lines[0]);
  const col=key=>headers.indexOf(key);
  const ident=col('ident'),gps=col('gps_code'),latCol=col('latitude_deg'),lonCol=col('longitude_deg'),nameCol=col('name'),typeCol=col('type');
  if(ident<0||latCol<0||lonCol<0)throw Error('공항 좌표 파일의 열 구성이 변경되었습니다.');
  const airportsByIcao=new Map();
  for(let i=1;i<lines.length;i++){
   if(!lines[i])continue;
   const row=splitAirportCsvRow(lines[i]);
   if(row[typeCol]==='closed')continue;
   const lat=Number(row[latCol]),lon=Number(row[lonCol]);
   if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)continue;
   const codeGps=String(gps>=0?row[gps]||'':'').trim().toUpperCase();
   const codeIdent=String(row[ident]||'').trim().toUpperCase();
   const name=row[nameCol]||'';
   const airport={lat,lon,name:name||codeGps||codeIdent};
   // GPS code is the strongest indication of the real ICAO code.
   if(/^[A-Z]{4}$/.test(codeGps))airportsByIcao.set(codeGps,{...airport,code:codeGps});
   if(/^[A-Z]{4}$/.test(codeIdent)&&(!airportsByIcao.has(codeIdent)||codeIdent===codeGps))
    airportsByIcao.set(codeIdent,{...airport,code:codeIdent});
  }
  return airportsByIcao;
 })();
 try{return await allIcaoAirportsPromise;}
 catch(err){allIcaoAirportsPromise=null;throw err;}
}
async function lookupManualAirport(code){
 // 1) Coordinates already included with MedAire alerts.
 const known=(typeof airports!=='undefined'&&Array.isArray(airports))?airports.find(a=>String(a.ICAO||'').toUpperCase()===code):null;
 if(known&&Number.isFinite(Number(known.Lat))&&Number.isFinite(Number(known.Lng)))return {code,lat:Number(known.Lat),lon:Number(known.Lng),name:known.Name||code};
 // 2) Existing NDB KML, if available. A KML failure must not abort airport lookup.
 if(!manualAirportsCache){
  try{
   const response=await fetch(MANUAL_ICAO_KML,{mode:'cors',cache:'force-cache'});
   if(response.ok)manualAirportsCache=parseManualIcaoKml(await response.text());
  }catch(_){/* Continue to worldwide airport data. */}
 }
 const inKml=manualAirportsCache?.find(a=>a.code===code);
 if(inKml)return inKml;
 // 3) Dedicated global airport dataset instead of rate-limited Nominatim.
 return (await getWorldwideIcaoAirports()).get(code)||null;
}

let manualIcaoSearchSerial=0;
$('manualIcaoForm').addEventListener('submit',async event=>{
 event.preventDefault();
 const input=$('manualIcaoInput');const code=input.value.trim().toUpperCase();input.value=code;
 if(!/^[A-Z]{4}$/.test(code)){manualIcaoMessage('ICAO 코드 4자리를 입력하세요. 예: RKSS');return;}
 const searchSerial=++manualIcaoSearchSerial;
 manualIcaoMessage('공항 좌표 확인 중…');
 try{
  const found=await lookupManualAirport(code);
  if(searchSerial!==manualIcaoSearchSerial)return;
  if(!found){manualIcaoMessage(code+'의 공항 좌표를 찾지 못했습니다.');return;}
  manualSelectedAirport=found;
  manualIcaoMessage('');
  const center=map.getCenter().lng;
  const adjusted=found.lon+360*Math.round((center-found.lon)/360);
  map.setView([found.lat,adjusted],Math.max(map.getZoom(),7),{animate:false});
  scheduleManualIcaoMarker();
 }catch(err){if(searchSerial===manualIcaoSearchSerial)manualIcaoMessage('공항 조회 실패: '+(err.message||err));}
});
$('manualIcaoClear').addEventListener('click',()=>{manualIcaoSearchSerial++;manualSelectedAirport=null;manualOverlay.replaceChildren();manualIcaoMessage('');$('manualIcaoInput').value='';map.closePopup();});

// Display matching country candidates while the user types; selection keeps a searchable Korean name.
const countrySuggestionPanel=$('countrySuggestions');

function normalizedCountryTerm(value){return String(value||'').toLocaleLowerCase().normalize('NFKC').replace(/\s+/g,'').trim();}
function matchingCountrySuggestions(input){
 const q=normalizedCountryTerm(input);
 if(!q)return [];
 const countries=new Map();
 for(const [ko,en] of KO_COUNTRY_SEARCH){
  const key=en.toLocaleLowerCase();
  const match=normalizedCountryTerm(ko).includes(q)||normalizedCountryTerm(en).includes(q);
  if(!match)continue;
  const existing=countries.get(key);
  // Prefer a canonical name rather than a long alias.
  if(!existing||ko.length<existing.ko.length)countries.set(key,{ko,en});
 }
 return [...countries.values()].sort((a,b)=>{
  const aStart=normalizedCountryTerm(a.ko).startsWith(q)||normalizedCountryTerm(a.en).startsWith(q);
  const bStart=normalizedCountryTerm(b.ko).startsWith(q)||normalizedCountryTerm(b.en).startsWith(q);
  return Number(bStart)-Number(aStart)||a.ko.localeCompare(b.ko,'ko');
 }).slice(0,12);
}
function hideCountrySuggestions(){countrySuggestionPanel.hidden=true;countrySuggestionPanel.replaceChildren();suggestionIndex=-1;visibleCountrySuggestions=[];$('query').setAttribute('aria-expanded','false');}
function chooseCountrySuggestion(option){$('query').value=option.ko;hideCountrySuggestions();selectedMarkerGroup=null;clearTimeout(searchTimer);render();$('query').focus();}
function updateCountrySuggestions(){

 visibleCountrySuggestions.forEach((option,index)=>{
  const btn=document.createElement('button');btn.type='button';btn.className='country-option';btn.setAttribute('role','option');btn.id='country-suggestion-'+index;btn.setAttribute('aria-selected','false');

// Enter: exact Korean/English match takes precedence; otherwise choose highlighted or first suggestion.
$('query').addEventListener('keydown',e=>{

  const selected=exact?{ko:exact[0],en:exact[1]}:(suggestionIndex>=0?visibleCountrySuggestions[suggestionIndex]:visibleCountrySuggestions[0]);
  if(selected){e.preventDefault();chooseCountrySuggestion(selected);}

// These Leaflet layers move automatically with pan/zoom, independently of Alert overlays.
const FLIGHT_ROUTE_BASE='https://bomi87.github.io/FLIGHT_MAP/live/';
const flightRoutes={
 HL8080:{color:'#e6a400',layer:null,busy:false},
 HL8372:{color:'#a3d94e',layer:null,busy:false}
};

function flightCoordList(raw){
 return String(raw||'').trim().split(/\s+/).map(token=>{
  const pair=token.split(',');const lon=Number(pair[0]),lat=Number(pair[1]);
  return Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180&&!(lat===0&&lon===0)?[lat,lon]:null;
 });
}
function flightKmlData(xmlText){
 const doc=new DOMParser().parseFromString(xmlText,'application/xml');
 if(doc.querySelector('parsererror'))throw Error('KML 분석 실패');
 const nodes=Array.from(doc.getElementsByTagName('*'));
 const descendants=(el,tag)=>Array.from(el.getElementsByTagName('*')).filter(x=>x.localName===tag);
 const routes=[],waypoints=[];
 for(const el of nodes){
  if(el.localName==='Placemark'){
   const point=descendants(el,'Point')[0];
   const pos=point?flightCoordList(descendants(point,'coordinates')[0]?.textContent).find(Boolean):null;
   if(pos){
    const name=Array.from(el.children).find(n=>n.localName==='name')?.textContent?.trim()||'Waypoint';
    const desc=Array.from(el.children).find(n=>n.localName==='description')?.textContent||'';
    waypoints.push({pos,name,desc});
   }
  }
  if(el.localName!=='LineString')continue;
  let seg=[];
  for(const p of flightCoordList(descendants(el,'coordinates')[0]?.textContent)){
   if(p)seg.push(p);
   else{if(seg.length>1)routes.push(seg);seg=[];}
  }
  if(seg.length>1)routes.push(seg);
 }
 if(!routes.length){
  const documents=nodes.filter(n=>n.localName==='Document');
  const roots=documents.filter(n=>!documents.some(m=>m!==n&&m.contains(n)));
  for(const root of roots.length?roots:[doc.documentElement]){
   const pts=[];
   for(const e of descendants(root,'Placemark')){
    const point=descendants(e,'Point')[0];
    const pos=point?flightCoordList(descendants(point,'coordinates')[0]?.textContent).find(Boolean):null;
    if(pos)pts.push(pos);
   }
   if(pts.length>1)routes.push(pts);
  }
 }
 if(!routes.length&&!waypoints.length)throw Error('경로 좌표가 없습니다');
 return {routes,waypoints};
}
// Unwrap successive longitudes so a Pacific dateline crossing takes the short route.
function unwrapFlightPath(points){
 let prev=null;return points.map(([lat,lng])=>{
  let lon=lng;if(prev!==null){while(lon-prev>180)lon-=360;while(lon-prev< -180)lon+=360;}
  prev=lon;return [lat,lon];
 });
}
const flightSvg=document.getElementById('flight-route-svg');
const flightWaypointOverlay=document.getElementById('flight-waypoint-overlay');
const FLIGHT_SVG_NS='http://www.w3.org/2000/svg';
let flightDrawPending=false;
function requestFlightDraw(){
 if(flightDrawPending)return;
 flightDrawPending=true;
 requestAnimationFrame(()=>{flightDrawPending=false;drawFlightRoutes();});
}
function flightRectsOverlap(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);}
function flightWaypointLabelAngle(point,paths,shift,w,h){
 let nearest=null,best=Infinity;
 // Compare the waypoint with each segment in its matching world copy.
 for(const path of paths||[]){
  for(let i=0;i<path.length-1;i++){
   const a=map.latLngToContainerPoint([path[i][0],path[i][1]+shift]);
   const b=map.latLngToContainerPoint([path[i+1][0],path[i+1][1]+shift]);
   const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
   if(len2<1)continue;
   const t=Math.max(0,Math.min(1,((point.x-a.x)*dx+(point.y-a.y)*dy)/len2));
   const d=(point.x-a.x-t*dx)**2+(point.y-a.y-t*dy)**2;
   if(d<best){best=d;nearest={dx,dy};}
  }
 }
 if(!nearest)return 0;
 const direction=Math.atan2(nearest.dy,nearest.dx)*180/Math.PI;
 const a=direction+90,b=direction-90;
 const angle=Math.sin(a*Math.PI/180)>=Math.sin(b*Math.PI/180)?a:b;
 return ((angle+180)%360+360)%360-180;
}
function drawFlightRoutes(){
 const w=flightSvg.clientWidth,h=flightSvg.clientHeight;
 if(!w||!h)return;
 flightSvg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 flightSvg.replaceChildren();
 flightWaypointOverlay.replaceChildren();
 const flightLabelRects=[]; // shared across HL8080 and HL8372
 for(const [tail,cfg] of Object.entries(flightRoutes)){
  if(!cfg.layer||!cfg.paths)continue;
  const pathEl=document.createElementNS(FLIGHT_SVG_NS,'path');
  const segments=[];
  for(const path of cfg.paths){
   for(const shift of [-720,-360,0,360,720]){
    let current=[];
    const flush=()=>{if(current.length>=2)segments.push('M'+current.map(p=>p.join(',')).join(' L'));current=[];};
    for(const [lat,lon] of path){
     const pt=map.latLngToContainerPoint([lat,lon+shift]);
     if(!Number.isFinite(pt.x)||!Number.isFinite(pt.y)){flush();continue;}
     // Clip by subpath reset only far outside the viewport; avoids very long SVG strings.
     if(Math.abs(pt.x)>w*3||Math.abs(pt.y)>h*3){flush();continue;}
     current.push([pt.x.toFixed(1),pt.y.toFixed(1)]);
    }
    flush();
   }
  }
  if(!segments.length)continue;
  pathEl.setAttribute('d',segments.join(' '));
  pathEl.setAttribute('stroke',cfg.color);
  pathEl.setAttribute('stroke-width','4');
  pathEl.setAttribute('stroke-opacity','1');
  pathEl.style.filter='drop-shadow(0 0 2px #0b1723)';
  flightSvg.appendChild(pathEl);
  // Use screen-space nearest route segment to orient labels perpendicular to the route.
  // Pins remain visible and clickable even when a label must be suppressed.
  const shown=new Set();
  for(const wp of cfg.waypoints||[]){
   for(const shift of [-720,-360,0,360,720]){
    const pt=map.latLngToContainerPoint([wp.pos[0],wp.pos[1]+shift]);
    if(pt.x < -25||pt.x>w+25||pt.y < -25||pt.y>h+25)continue;
    const id=wp.name+'|'+Math.round(pt.x)+'|'+Math.round(pt.y);
    if(shown.has(id))continue;shown.add(id);
    const pin=document.createElement('button');pin.type='button';pin.className='flight-wp-item';
    pin.style.left=pt.x+'px';pin.style.top=pt.y+'px';pin.title=tail+' · '+wp.name;
    // Preserve the original circular waypoint marker; only the label is restyled.
    const dot=document.createElement('span');dot.className='flight-wp-dot';dot.style.background=cfg.color;
    pin.append(dot);
    if(map.getZoom()>=4){
     const label=document.createElement('span');label.className='flight-wp-name';
     label.style.borderColor=cfg.color;
     label.style.color=tail==='HL8080'?'#a96600':'#527f12';
     label.style.backgroundColor=tail==='HL8080'?'#fff8e6':'#f3ffe6';
     label.textContent=wp.name;
     // Rotating a horizontal label around its left edge keeps it next to the waypoint.
     const angle=flightWaypointLabelAngle(pt,cfg.paths,shift,w,h);
     label.style.transform='rotate('+angle+'deg)';
     pin.append(label);
    }
    pin.addEventListener('click',event=>{
     event.stopPropagation();
     const content=document.createElement('div');
     const title=document.createElement('strong');title.textContent=tail+' · '+wp.name;content.append(title);
     if(wp.desc){const extra=document.createElement('div');extra.style.cssText='white-space:pre-line;margin-top:6px;max-height:230px;overflow:auto';extra.textContent=new DOMParser().parseFromString(wp.desc,'text/html').body.textContent||'';content.append(extra);}
     L.popup({maxWidth:320}).setLatLng([wp.pos[0],wp.pos[1]+shift]).setContent(content).openOn(map);
    });
    flightWaypointOverlay.append(pin);
    const label=pin.querySelector('.flight-wp-name');
    if(label){
     const rect=label.getBoundingClientRect();
     const pad=3;
     const r={left:rect.left-pad,right:rect.right+pad,top:rect.top-pad,bottom:rect.bottom+pad};
     if(!rect.width||!rect.height||flightLabelRects.some(other=>flightRectsOverlap(r,other))){
      label.remove(); // hide label only; never hide waypoint marker or popup
     }else flightLabelRects.push(r);
    }
   }
  }
 }
}

async function toggleFlightRoute(tail){
 const cfg=flightRoutes[tail],button=$('route'+tail);
 if(!cfg||cfg.busy)return;
 if(cfg.layer){map.removeLayer(cfg.layer);cfg.layer=null;cfg.paths=null;cfg.waypoints=null;requestFlightDraw();button.setAttribute('aria-pressed','false');return;}
 cfg.busy=true;button.disabled=true;button.textContent='로딩…';
 try{
  const response=await fetch(FLIGHT_ROUTE_BASE+tail+'.kml',{cache:'no-store',mode:'cors'});
  if(!response.ok)throw Error('KML HTTP '+response.status);
  const {routes,waypoints}=flightKmlData(await response.text());
  const layer=L.layerGroup();
  const routeBounds=[];
  const svgPaths=[];
  for(const original of routes){
   const path=unwrapFlightPath(original);
   for(const pt of path)routeBounds.push(pt);
   svgPaths.push(path);
  }
  // The single HTML overlay renders all clickable waypoint pins/labels.
  // Avoid duplicates from the older Leaflet pane (which obscured the new pin design).
  const labels=[];
  for(const wp of waypoints)routeBounds.push(wp.pos);
  layer.addTo(map);cfg.layer=layer;cfg.labels=labels;cfg.paths=svgPaths;cfg.waypoints=waypoints;
  button.setAttribute('aria-pressed','true');
  updateFlightLabels();
  // The previous implementation only added lines off-screen. Fit visible route on toggle.
  if(routeBounds.length){
   const center=routeBounds.reduce((n,p)=>n+p[1],0)/routeBounds.length;
   const normalized=routeBounds.map(([lat,lng])=>{let x=lng;while(x-center>180)x-=360;while(x-center< -180)x+=360;return [lat,x];});
   map.fitBounds(L.latLngBounds(normalized),{padding:[32,32],maxZoom:7,animate:false});
  }
  requestFlightDraw();
  $('status').textContent=tail+' 경로 표시 · '+routes.length+'개 경로 · '+waypoints.length+'개 Waypoint';
 }catch(err){
   $('status').textContent=tail+' KML 오류: '+(err.message||err);
   alert(tail+' 경로를 표시하지 못했습니다: '+(err.message||err));
 }
 finally{cfg.busy=false;button.disabled=false;button.textContent=tail;}
}

}
map.on('zoomend',updateFlightLabels);
if(!['loadRemote','routeHL8080','routeHL8372'].every(id=>document.getElementById(id))){throw new Error('ROUTES v6.1 header controls missing');}
$('routeHL8080').addEventListener('click',()=>toggleFlightRoute('HL8080'));
$('routeHL8372').addEventListener('click',()=>toggleFlightRoute('HL8372'));

// All alert data loads wait until common-auth confirms the current user's app permission.
let medaireStartedAfterAuth=false;
$('loadRemote').onclick=()=>{if(window.CURRENT_PORTAL_USER)sync();};
setInterval(()=>{if(window.CURRENT_PORTAL_USER && !document.hidden && $('backend').value.trim())sync();},120000);
window.addEventListener('resize',()=>map.invalidateSize(),{passive:true});
window.startProtectedApp=function(){
 if(medaireStartedAfterAuth)return;
 if(!window.CURRENT_PORTAL_USER)return;
 medaireStartedAfterAuth=true;
 requestAnimationFrame(()=>{
  // Leaflet was constructed while #appRoot was hidden (zero-sized map).
  // Recompute the visible size and reset the initial center before fetching alerts.
  map.invalidateSize({pan:false,animate:false});
  map.setView([15,20],2,{animate:false});
  if(typeof requestFlightDraw==='function')requestFlightDraw();
  if(typeof scheduleManualIcaoMarker==='function')scheduleManualIcaoMarker();
  // The following frame ensures all overlays use the actual visible dimensions.
  requestAnimationFrame(()=>{
   map.invalidateSize({pan:false,animate:false});
   map.setView([15,20],2,{animate:false});
   if(typeof requestFlightDraw==='function')requestFlightDraw();
   sync();
  });
 });
};
// Safe fallback for a valid cached portal user when the approval event raced the app script.
window.addEventListener('portal-auth-approved',()=>{
 if(window.CURRENT_PORTAL_USER)window.startProtectedApp();
});
</script>
