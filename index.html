<style>

gap:7px;flex-wrap:wrap;align-items:center;margin-left:auto}.connect input{width:210px;font-size:13px;padding:8px}.btn{border:1px solid #456b99;background:#213c62;color:#edf5ff;border-radius:7px;padding:8px 10px}.btn:hover{background:#315788}.fileBtn{display:inline-flex;align-items:center}.foot{color:#b4c3d8;font-size:12px;padding:7px 12px;border-top:1px solid #34445b}.icaoIcon{background:#111e32;border:1px solid #d9e6ff;border-radius:6px;padding:3px 6px;color:#fff;font-weight:800;white-space:nowrap;font-size:12px;box-shadow:0 2px 9px #0009}.sosPin{display:flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;border:2px solid #fff;background:#25ada8;color:#071b25;font-size:10px;font-weight:900;box-shadow:0 2px 8px #000b}.countryPin{display:inline-flex;align-items:center;justify-content:center;min-width:23px;height:23px;padding:0 4px;border-radius:5px;border:1.5px solid #e3eefd;background:#33749b;color:white;font-weight:800;font-size:10px;box-shadow:0 2px 7px #0009}.regionPin{display:inline-flex;align-items:center;justify-content:center;min-width:23px;height:23px;padding:0 4px;border-radius:5px;border:1.5px solid #f1dbff;background:#81539c;color:white;font-weight:800;font-size:10px;box-shadow:0 2px 7px #0009}.icaoIcon b{color:#ffca70;font-size:11px;margin-left:4px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#172338;color:#ebf2ff}.popup{max-height:320px;overflow:auto;max-width:350px}.popup button{display:block;width:100%;border:0;border-bottom:1px solid #344660;background:none;text-align:left;color:#f0f5ff;padding:9px 2px}.popup button:hover{background:#2b3f5a}.notice{padding:12px;color:#bccbe0}.modal{position:fixed;inset:0;background:#000b;z-index:1200;display:none;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.modalbody{background:#172439;border:1px solid #4c607b;border-radius:12px;max-width:650px;width:100%;max-height:80vh;overflow:auto;padding:18px;overflow-wrap:anywhere}.close{float:right}.detailtext{line-height:1.7}.detailtext p{margin:8px 0}.status{font-size:12px;color:#b8cee8}.hide{display:none}@media(max-width:760px){.shell{display:flex;flex-direction:column;height:auto}.side{height:48vh;min-height:360px;border-right:0}.mapwrap{height:47vh;min-height:280px;order:-1}.top{padding:9px}.top h1{width:100%}.connect{width:100%;margin:0}.connect input{flex:1;width:100px}.controls{padding:8px}.alert{padding:10px}}

/* Geographic markers are native Leaflet markers; panes fix their stacking order. */
.alert-marker-leaflet{background:transparent;border:0;overflow:visible!important}.alert-marker-inner{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;cursor:pointer;pointer-events:auto;line-height:1}
.alert-marker-inner{display:block}
.alert-marker-leaflet:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:5px}
.alert-marker-inner .icaoIcon,.alert-marker-inner .sosPin,.alert-marker-inner .countryPin,.alert-marker-inner .regionPin{display:inline-flex;align-items:center;justify-content:center}
.group-reset{margin-left:auto;flex-shrink:0;background:#294566;border:1px solid #6082a6;color:#fff;border-radius:5px;padding:4px 9px;font-size:12px}.count:has(.group-reset){display:flex;align-items:center;gap:8px;justify-content:space-between}.feed-group-heading{position:sticky;top:0;z-index:2;padding:10px 12px;background:#243b54;color:#ffd18f;border-bottom:1px solid #6d84a0;font-weight:750;font-size:12px}.popup-group{font-size:12px;font-weight:750;color:#ffc27d;background:#24364d;padding:7px 6px;margin-top:10px;border-radius:5px}.popup-empty{padding:9px 3px;color:#99afc7;font-size:12px}
/* Scope label appears first in each alert's tag row. */
.scopeTag{font-weight:800;white-space:nowrap;color:#f5f8ff}
.scope-icao{background:#263f67;border-color:#a8c9fa}
.scope-local{background:#13585c;border-color:#54d0ca;color:#bafbf4}
.scope-region{background:#53336e;border-color:#c6a0e6}
.scope-country{background:#1d536e;border-color:#77b9da}
/* Mobile compact controls: prioritize the Alert feed over search/filter chrome. */
@media (max-width:760px){
  .top{padding:5px 8px;gap:4px;}
  .top h1{font-size:14px;margin:0;width:auto;}
  .top small,.top .status{font-size:10px;}
  .connect{gap:4px;}

  body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  .mapwrap{order:-1;flex:0 0 25%;height:25%;min-height:130px;}

  .alert .heading{margin:4px 0;line-height:1.35;}
  .alert .meta{gap:3px;}
}

<body><header class="top"><h1>✈ MedAire Alert Monitor</h1><span id="status" class="status">데이터를 불러오세요</span><div class="connect"><input id="backend" value="https://script.google.com/macros/s/AKfycbzHiJfw__LOpkZSwx_i0KU3YgCXSxQMocrm175qTbpsus5Ze7VPSnub2rvtpUBexQNQ-Q/exec" placeholder="Apps Script /exec URL" aria-label="백엔드 URL"><button class="btn" id="loadRemote">서버 조회</button><label class="btn fileBtn">JSON 불러오기<input class="hide" type="file" id="fileInput" accept=".json,.txt,application/json" multiple></label></div></header>
<div class="shell"><section class="side"><div class="controls"><div class="query-combo"><input id="query" placeholder="국가, 공항 ICAO, 내용 검색" autocomplete="off" aria-autocomplete="list" aria-controls="countrySuggestions" aria-expanded="false"><div id="countrySuggestions" class="country-suggestions" role="listbox" hidden></div></div><select id="country"><option value="">모든 국가</option></select><select id="severity"><option value="">모든 심각도</option></select><select id="category"><option value="">모든 카테고리</option></select><select id="period"><option value="1">최근 24시간</option><option value="3" selected>최근 3일</option><option value="7">최근 7일</option><option value="30">최근 30일</option></select></div><div class="count" id="count">Alert 0건</div><div class="feed" id="feed"><div class="notice">서버에서 Alert를 자동 조회합니다.</div></div><div class="foot">최신 발행 Alert가 항상 맨 위 · 지도: 공항 ICAO · 청록=특정 위치 · 파랑=국가 대표점 · 보라=광역 대표점</div></section><div class="mapwrap"><div id="map"></div><div id="mapstate" role="status">지도 준비 중…</div></div></div>
<div class="modal" id="modal"><div class="modalbody"><button class="btn close" id="close" aria-label="닫기" title="닫기">×</button><div id="details"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';
const $=id=>document.getElementById(id);

// Esri Light Gray basemap (same provider/style as Airport Data Search).
// Unlike the previous embedded vector map, this fetches map tiles when needed.
const map=L.map('map',{worldCopyJump:false,preferCanvas:true,zoomControl:true,zoomSnap:0.5,minZoom:1,maxZoom:13}).setView([24,18],2);
const ESRI_BASE='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
const ESRI_LABELS='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}';
const esriOptions={maxZoom:13,maxNativeZoom:13,attribution:'Tiles © Esri',updateWhenIdle:true,updateWhenZooming:false,keepBuffer:1};
const esriBase=L.tileLayer(ESRI_BASE,esriOptions).addTo(map);
// Load additional place-name tiles only while zoomed in, avoiding doubling requests on the world view.
const esriLabels=L.tileLayer(ESRI_LABELS,{...esriOptions,attribution:'Labels © Esri',pane:'overlayPane'});
function syncEsriLabels(){
  if(map.getZoom()>=5){if(!map.hasLayer(esriLabels))esriLabels.addTo(map);}
  else if(map.hasLayer(esriLabels))map.removeLayer(esriLabels);
}
map.on('zoomend',syncEsriLabels);
syncEsriLabels();
// Non-blocking diagnosis of tile failures. Alert markers never depend on tiles.
let tileFailures=0;
esriBase.on('tileerror',()=>{tileFailures++; if(tileFailures===1)console.warn('Esri map tile request failed. Check network/content blockers.');});
const mapState=$('mapstate');
mapState.hidden=true;
let alerts=[], airports=[], filtered=[], activeId=null;
let selectedMarkerGroup=null;
for(const [pane,z] of [['markerCountry',610],['markerRegion',620],['markerLocal',630],['markerAirport',640]]){map.createPane(pane);map.getPane(pane).style.zIndex=String(z);}
const layer=L.layerGroup().addTo(map);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const plain=s=>{const tmp=document.createElement('template');tmp.innerHTML=String(s??'');return (tmp.content.textContent||'').trim();};
const sortDate=a=>Date.parse(a.Date||a.CreatedDate||0)||0;
const normList=(data,keys)=>{if(Array.isArray(data))return data;for(const k of keys)if(Array.isArray(data?.[k]))return data[k];return null;};
function ingest(data){
 if(data?.ok===false)throw Error(data.error||'Server error');
 const arr=normList(data?.alerts??data,['Alerts','alerts','Data','data','Items','items']);
 const ap=normList(data?.airports??data,['Airports','airports','Data','data','Items','items']);
 if(arr && (arr.length===0 || arr[0]?.NodeId!==undefined || arr[0]?.AffectedAirports!==undefined || arr[0]?.Id!==undefined)){alerts=arr;}
 if(ap && (ap.length===0 || ap[0]?.ICAO!==undefined)){airports=ap;}
 if(!arr && !ap)throw Error('Alert/공항 JSON 배열을 찾지 못했습니다.');
 alerts=[...alerts].sort((a,b)=>sortDate(b)-sortDate(a));
 const serverAt=data?.updatedAt ? new Date(data.updatedAt) : null;
 const newest=alerts.length ? new Date(alerts[0].Date||alerts[0].CreatedDate||0) : null;
 const stamp=d=>(d&&Number.isFinite(d.getTime()))?d.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false}):'확인 불가';
 $('status').textContent=`Alert ${alerts.length.toLocaleString()}건 / 공항 ${airports.length.toLocaleString()}곳 · 서버 갱신 ${stamp(serverAt)} · 최신 기사 ${stamp(newest)}`;
 if(data?.windowStats){const failed=data.windowStats.filter(x=>x.error);if(failed.length) $('status').textContent+=' · 일부 데이터 소스 오류';}
 
 rebuildOptions();render();
 // After a successful server load, show newest items first, even if previously scrolled.
 $('feed').scrollTop=0;
}
function severityClass(value){const s=String(value||'').trim().toLowerCase();return s==='special advisory'?'sev-danger':s==='advisory'?'sev-warning':s==='notice'?'sev-success':'';}
function severityKo(value){const names={'special advisory':'심각','advisory':'중간','notice':'낮음'};return names[String(value||'').trim().toLowerCase()]||String(value||'');}
function rebuildOptions(){
 const choices=[['country',a=>a.SelectedCountry||a.TitleLocation||a.CountriesAffected?.[0]?.Name],['severity',a=>a.Severity],['category',a=>a.Categories||[]]];
 for(const [id,get] of choices){const el=$(id),prev=el.value,first=el.options[0].textContent;
 const values=[...new Set(alerts.flatMap(a=>{const x=get(a);return Array.isArray(x)?x:[x]}).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
 el.replaceChildren(new Option(first,''),...values.map(v=>new Option(id==='severity'?severityKo(v):v,v)));el.value=values.includes(prev)?prev:'';}
}

function countrySearchTerms(input){
 const q=String(input||'').trim().toLocaleLowerCase();
 if(!q)return [];
 const terms=new Set([q]);
 if(/[가-힣]/.test(q)){
  for(const [ko,en] of KO_COUNTRY_SEARCH){
   // Supports full country names and partial Korean input (e.g. '일본', '대한').
   if(ko.toLocaleLowerCase().includes(q)||normalizedCountryTerm(ko).includes(normalizedCountryTerm(q))){
    for(const name of en.split(/\s*\/\s*/))terms.add(name.toLocaleLowerCase());
    terms.add(en.toLocaleLowerCase());
   }
  }
 }
 return [...terms];
}
function searchableAlertText(a){
 return [a.Title,a.Heading,a.Blocks,a.Summary,a.SelectedCountry,a.TitleLocation,a.Source,
   ...(a.AffectedAirports||[]),...(a.Categories||[]),
   ...(a.CountriesAffected||[]).map(c=>typeof c==='string'?c:(c.Name||''))
 ].join(' ').toLocaleLowerCase();
}

  if(cat&&!(a.Categories||[]).includes(cat))return false;
  if(days&&sortDate(a)<Date.now()-days*86400000)return false;
  if(q&&!searchTerms.some(term=>searchableAlertText(a).includes(term)))return false;

 });
 filtered.sort((a,b)=>sortDate(b)-sortDate(a));
 let displayGroups=null;
 if(selectedMarkerGroup){

function locationPoints(a){
 const loc=a.Locations;
 const arr=Array.isArray(loc)?loc:(Array.isArray(loc?.features)?loc.features:[]);
 return arr.map(f=>{
   const c=f?.geometry?.coordinates;
   return {lat:Number(f.lat??(Array.isArray(c)?c[1]:NaN)),lng:Number(f.lng??(Array.isArray(c)?c[0]:NaN)),name:f.name||f.properties?.Name||'',primary:!!(f.primary??f.properties?.IsPrimary),countryIso:String(f.countryIso||f.properties?.CountryIsoList||''),countryName:String(f.countryName||f.properties?.CountryNameList||'')};
 }).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180);
}
// Only explicitly associated countries count. Regional labels like "Asia & the Pacific"
// are NOT country identities. Country names and ISO codes are normalized as tokens.
function countryParts(v){return String(v||'').split(/[,;/]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);}
function isRegion(v){return /asia.*pacific|worldwide|global|multiple countr|all countr|middle east|european region|africa region/i.test(String(v||''));}
function articleCountries(a){
 const result=new Set();
 const points=locationPoints(a);
 // Exact associations from International SOS GeoJSON (preferred).
 for(const p of points){
   for(const x of [...countryParts(p.countryIso),...countryParts(p.countryName)])result.add(x);
 }
 if(result.size)return result;
 // Aviation records do not carry GeoJSON country metadata.
 const country=a.SelectedCountry||a.TitleLocation||a.CountriesAffected?.[0]?.Name||'';
 if(!isRegion(country))for(const x of countryParts(country))result.add(x);
 return result;
}
function matchesCountry(a,countries){
 if(!countries||!countries.size)return false;
 return [...articleCountries(a)].some(c=>countries.has(c));
}
function selectMarkerArticles(label,items,coords,code){
 const unique=[...new Map(items.map(a=>[articleKey(a),a])).values()];
 const countries=new Set();
 if(code){
  for(const ap of airports){
   if(String(ap.ICAO||'').trim().toUpperCase()!==String(label).trim().toUpperCase())continue;
   for(const x of [...countryParts(ap.Country),...countryParts(ap.Isocode3),...countryParts(ap.Isocode)])countries.add(x);
  }
 }else{
  // Geographic marker: select country ONLY from the point clicked,
  // never all countries mentioned by a multi-country article.
  for(const a of unique)for(const p of locationPoints(a)){
   if(Math.abs(p.lat-coords[0])>0.00012||Math.abs(p.lng-coords[1])>0.00012)continue;
   for(const x of [...countryParts(p.countryIso),...countryParts(p.countryName)])countries.add(x);
  }
 }
 // Fallback when using an older backend response without country metadata.
 // Do not extrapolate a regional alert into a particular country.
 if(!countries.size){
  for(const a of unique){
   const c=a.SelectedCountry||a.TitleLocation||'';
   if(!isRegion(c))for(const x of countryParts(c))countries.add(x);
  }
 }
 selectedMarkerGroup={label,items:unique,countries};
 render();
 $('feed').scrollTop=0;
}

// A point supplied by the provider can be a country centroid rather than an incident site.
// Treat country-named features as country-wide; ambiguous regional notices aren't site events.
function normalizedPlace(v){return String(v||'').toLowerCase().normalize('NFKD').replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function pointScope(p,a){
 const name=normalizedPlace(p.name);
 const cn=countryParts(p.countryName).map(normalizedPlace);
 const title=normalizedPlace(a.TitleLocation||a.SelectedCountry||'');
 if(!name)return 'region';
 if(isRegion(p.name) || isRegion(a.TitleLocation||a.SelectedCountry||'')){
   // Explicit named city / airport is still local even under a regional headline.
   if(cn.includes(name))return 'country';
   return cn.length && name!=='asia pacific' && name!=='asia and the pacific' ? 'local' : 'region';
 }
 if(cn.includes(name)||name===title)return 'country';
 // Country-group names: e.g. "Japan, Taiwan (China)" without an individual city.
 if(cn.some(c=>c&&name.includes(c)&&name.length>c.length+3))return 'region';
 if(/^(nationwide|countrywide|across the country|multiple locations|various locations|national|country|entire country)$/.test(name))return 'country';
 return 'local';
}
// One classification shared by the feed and the map.
// A specific airport takes precedence over local / regional / country scope.
function alertScope(a){
  if(Array.isArray(a.AffectedAirports) && a.AffectedAirports.some(c=>String(c||'').trim())) return 'icao';
  const points=locationPoints(a);
  const scopes=points.map(p=>pointScope(p,a));
  if(scopes.includes('local'))return 'local';
  if(scopes.includes('region'))return 'region';
  if(scopes.includes('country'))return 'country';
  return 'region'; // Unlocated notice: broader/unspecified, never falsely a specific point.
}
const scopeLabels={icao:'공항',local:'특정지점',region:'광역',country:'국가'};
const markerPriority={country:100,region:200,local:300,icao:400};
function articleKey(a){return String(a.Id??a.NodeId??(a.Title||a.Heading||'')+'|'+(a.Date||a.CreatedDate||''));}
function alertPopup(title,items){
 const panel=document.createElement('div');panel.className='popup';
 const same=[...new Map(items.map(a=>[articleKey(a),a])).values()].sort((a,b)=>sortDate(b)-sortDate(a));

 // Match the same country without accidentally including global or unrelated notices.
 const ids=new Set(same.map(articleKey));
 const rest=filtered.filter(a=>!ids.has(articleKey(a))&&matchesCountry(a,countries))
   .sort((a,b)=>sortDate(b)-sortDate(a));
 function section(name,arr){
   const heading=document.createElement('div');heading.className='popup-group';
   heading.textContent=name+' ('+arr.length+')';panel.append(heading);
   if(!arr.length){const empty=document.createElement('div');empty.className='popup-empty';empty.textContent='추가 기사가 없습니다.';panel.append(empty);return;}
   for(const a of arr){

 }

 section('해당 위치 / 공항 Alert',same);

// Leaflet owns the geographic coordinates of every marker. Panning, zooming,
// resizing and dateline wrapping are handled by its native marker layer.
// Separate panes enforce airport > local > region > country stacking.
function drawMarkers(){
  layer.clearLayers();
  const coords=new Map(),byCode=new Map(),byPoint=new Map(),byCountry=new Map();
  for(const ap of airports){
    const code=String(ap.ICAO||'').trim().toUpperCase(),lat=Number(ap.Lat),lng=Number(ap.Lng);
    if(code&&Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180)coords.set(code,[lat,lng]);
  }
  for(const a of filtered){
    const codes=Array.isArray(a.AffectedAirports)?a.AffectedAirports:[];
    for(const raw of codes){
      const code=String(raw).trim().toUpperCase();
      if(!coords.has(code))continue;
      if(!byCode.has(code))byCode.set(code,[]);
      byCode.get(code).push(a);
    }
    for(const p of locationPoints(a)){
      if(codes.some(c=>{const xy=coords.get(String(c).trim().toUpperCase());return xy&&Math.abs(xy[0]-p.lat)<0.08&&Math.abs(xy[1]-p.lng)<0.08;}))continue;
      const scope=pointScope(p,a);
      const key=scope+'|'+p.lat.toFixed(4)+','+p.lng.toFixed(4);
      const target=scope==='local'?byPoint:byCountry;
      if(!target.has(key))target.set(key,{p,items:[],scope});
      target.get(key).items.push(a);
    }
  }
  function addOverlay(coords,label,items,mode){
    const pane={icao:'markerAirport',local:'markerLocal',region:'markerRegion',country:'markerCountry'}[mode];
    const span=document.createElement('span');
    span.className=mode==='icao'?'icaoIcon':mode==='local'?'sosPin':mode==='country'?'countryPin':'regionPin';
    if(mode==='icao'){
      span.textContent=label;
      if(items.length>1){const b=document.createElement('b');b.textContent=String(items.length);span.append(b);}
    } else span.textContent=String(items.length);
    const wrapper=document.createElement('div');wrapper.className='alert-marker-inner';wrapper.append(span);
    const icon=L.divIcon({className:'alert-marker-leaflet',html:wrapper.outerHTML,iconSize:[0,0],iconAnchor:[0,0]});
    const marker=L.marker(coords,{pane,icon,keyboard:true,riseOnHover:false,autoPanOnFocus:false,
      title:label+' · '+items.length+' Alert',alt:label+' · '+items.length+' Alert'});
    marker.on('click',()=>{
      selectMarkerArticles((mode==='country'?'국가 전체 · ':mode==='region'?'광역 · ':'')+label,items,coords,mode==='icao');
      map.closePopup();
    });
    marker.addTo(layer);
  }
  // Draw low-priority markers first as an additional stacking safeguard.
  for(const {p,items,scope} of byCountry.values())if(scope==='country')addOverlay([p.lat,p.lng],p.name||'Country',items,'country');
  for(const {p,items,scope} of byCountry.values())if(scope!=='country')addOverlay([p.lat,p.lng],p.name||'Region',items,'region');
  for(const {p,items} of byPoint.values())addOverlay([p.lat,p.lng],p.name||'Alert location',items,'local');
  for(const [code,items] of byCode)addOverlay(coords.get(code),code,items,'icao');
  if(!layer.getLayers().length&&filtered.length){mapState.hidden=false;mapState.textContent='표시할 위치 정보가 없습니다';}
  else mapState.hidden=true;
}

function openAlert(a){activeId=a.Id??a.NodeId;const codes=(a.AffectedAirports||[]).map(String),name=plain(a.Heading)||a.Title||'Alert';
 $('details').innerHTML=`<div class="time">${esc(a.Date?new Date(a.Date).toLocaleString('ko-KR',{hour12:false}):'')} · ${esc(a.SelectedCountry||'')}</div><h2>${esc(name)}</h2><p><b>Source:</b> ${esc(a.Source||'Aviation')}<br><b>Severity:</b> <span class="sev detail-severity ${severityClass(a.Severity)}">${esc(severityKo(a.Severity||'–'))}</span><br><b>Status:</b> ${esc(a.AlertStatus||'–')}<br><b>ICAO:</b> ${esc(codes.join(', ')||'–')}<br><b>Category:</b> ${esc((a.Categories||[]).join(', '))}</p><div class="detailtext" id="bodyText"></div>`;

// Display matching country candidates while the user types; selection keeps a searchable Korean name.
const countrySuggestionPanel=$('countrySuggestions');
let suggestionIndex=-1;
let visibleCountrySuggestions=[];
function normalizedCountryTerm(value){return String(value||'').toLocaleLowerCase().normalize('NFKC').replace(/\s+/g,'').trim();}
function matchingCountrySuggestions(input){
 const q=normalizedCountryTerm(input);
 if(!q)return [];
 const countries=new Map();
 for(const [ko,en] of KO_COUNTRY_SEARCH){
  const key=en.toLocaleLowerCase();
  const match=normalizedCountryTerm(ko).includes(q)||normalizedCountryTerm(en).includes(q);
  if(!match)continue;
  const existing=countries.get(key);
  // Prefer a canonical name rather than a long alias.
  if(!existing||ko.length<existing.ko.length)countries.set(key,{ko,en});
 }
 return [...countries.values()].sort((a,b)=>{
  const aStart=normalizedCountryTerm(a.ko).startsWith(q)||normalizedCountryTerm(a.en).startsWith(q);
  const bStart=normalizedCountryTerm(b.ko).startsWith(q)||normalizedCountryTerm(b.en).startsWith(q);
  return Number(bStart)-Number(aStart)||a.ko.localeCompare(b.ko,'ko');
 }).slice(0,12);
}
function hideCountrySuggestions(){countrySuggestionPanel.hidden=true;countrySuggestionPanel.replaceChildren();suggestionIndex=-1;visibleCountrySuggestions=[];$('query').setAttribute('aria-expanded','false');}
function chooseCountrySuggestion(option){$('query').value=option.ko;hideCountrySuggestions();selectedMarkerGroup=null;clearTimeout(searchTimer);render();$('query').focus();}
function updateCountrySuggestions(){
 visibleCountrySuggestions=matchingCountrySuggestions($('query').value);
 countrySuggestionPanel.replaceChildren();suggestionIndex=-1;
 if(!visibleCountrySuggestions.length){hideCountrySuggestions();return;}
 visibleCountrySuggestions.forEach((option,index)=>{
  const btn=document.createElement('button');btn.type='button';btn.className='country-option';btn.setAttribute('role','option');btn.id='country-suggestion-'+index;btn.setAttribute('aria-selected','false');
  const title=document.createElement('span');title.textContent=option.ko;
  const sub=document.createElement('small');sub.textContent=option.en;
  btn.append(title,sub);
  btn.addEventListener('pointerdown',e=>e.preventDefault());
  btn.addEventListener('click',()=>chooseCountrySuggestion(option));
  countrySuggestionPanel.append(btn);
 });
 countrySuggestionPanel.hidden=false;$('query').setAttribute('aria-expanded','true');
}
$('query').addEventListener('keydown',e=>{
 if(countrySuggestionPanel.hidden)return;
 if(e.key==='Escape'){e.preventDefault();hideCountrySuggestions();return;}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){
  e.preventDefault();suggestionIndex=(suggestionIndex+(e.key==='ArrowDown'?1:-1)+visibleCountrySuggestions.length)%visibleCountrySuggestions.length;
  [...countrySuggestionPanel.children].forEach((el,i)=>{el.classList.toggle('is-active',i===suggestionIndex);el.setAttribute('aria-selected',String(i===suggestionIndex));});
  countrySuggestionPanel.children[suggestionIndex]?.scrollIntoView({block:'nearest'});
 }else if(e.key==='Enter'&&suggestionIndex>=0){e.preventDefault();chooseCountrySuggestion(visibleCountrySuggestions[suggestionIndex]);}
});
$('query').addEventListener('focus',updateCountrySuggestions);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.query-combo'))hideCountrySuggestions();});
let searchTimer;
for(const id of ['query','country','severity','category','period'])$(id).addEventListener(id==='query'?'input':'change',()=>{selectedMarkerGroup=null;if(id==='query'){updateCountrySuggestions();clearTimeout(searchTimer);searchTimer=setTimeout(render,140);}else render();});
$('fileInput').addEventListener('change',async e=>{for(const file of e.target.files){try{ingest(JSON.parse(await file.text()));}catch(err){alert(file.name+': '+err.message);}}e.target.value='';});
// JSONP avoids GAS cross-origin redirect limitations. No credentials are sent from the browser.
let syncing=false;
async function sync(){if(syncing)return;const url=$('backend').value.trim();
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){alert('올바른 Apps Script /exec URL을 입력해 주세요.');return;}
 syncing=true;$('status').textContent='MedAire 조회 중… (응답 대기)';
 const cb='medaireCb'+Date.now(),s=document.createElement('script');let done=false;
 const timer=setTimeout(()=>finish(new Error('서버 응답 시간 초과')),55000);
 function finish(err,data){if(done)return;done=true;clearTimeout(timer);delete window[cb];s.remove();syncing=false;
 if(err){$('status').textContent='오류: '+err.message;return;}try{ingest(data);}catch(e){$('status').textContent='오류: '+e.message;}}
 window[cb]=data=>finish(null,data);
 s.onerror=()=>finish(new Error('네트워크 오류 / 배포 또는 권한 확인'));
 s.src=url+'?action=feed&callback='+encodeURIComponent(cb);
 document.head.append(s);
}
$('loadRemote').onclick=sync;
setInterval(()=>{if(!document.hidden && $('backend').value.trim())sync();},120000);
window.addEventListener('resize',()=>map.invalidateSize(),{passive:true});
sync();
